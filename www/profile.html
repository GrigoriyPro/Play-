<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Play! - Регистрация</title>
</head>
<body>

    <header>
        <h1>Play!</h1>
        <nav>
            <a href="index.html">Главная</a> |
            <a href="catalog.html">Каталог</a> |
            <a href="delivery.html">Доставка и оплата</a> |
            <a href="about.html">О нас</a> |
            <a href="profile.html">Профиль</a>
        </nav>
        <hr>
    </header>

    <main>
        <h2>Регистрация нового пользователя</h2>

        <form action="#" method="POST">
            <p>
                <label for="name">Имя и Фамилия:</label><br>
                <input type="text" id="name" name="name" required placeholder="Иванов Иван">
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required placeholder="example@mail.ru">
            </p>

            <p>
                <label for="phone">Телефон:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 000-00-00">
            </p>

            <p>
                <label for="password">Пароль:</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <label for="confirm_password">Повторите пароль:</label><br>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </p>

            <p>
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">Я согласен с условиями обработки персональных данных</label>
            </p>

            <button type="submit">Зарегистрироваться</button>
        </form>

        <p>Уже есть аккаунт? <a href="#">Войти</a></p>
    </main>

    <br><br><br>

    </footer>
</body>
