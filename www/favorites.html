<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play! - Избранное</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="logo">
                <span class="logo__title">Play<span class="logo__accent">!</span></span>
            </a>
            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                    <li class="nav__item nav__item--dropdown">
                        <button type="button" class="catalog-toggle" id="catalog-toggle" aria-expanded="false">
                            Каталог
                            <svg class="catalog-toggle__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div class="catalog-panel" id="catalog-panel">
                            <div class="catalog-categories">
                                <a href="catalog.html?genre=strategy" class="catalog-categories__item">Стратегии</a>
                                <a href="catalog.html?genre=card" class="catalog-categories__item">Карточные</a>
                                <a href="catalog.html?genre=family" class="catalog-categories__item">Семейные</a>
                                <a href="catalog.html?genre=puzzle" class="catalog-categories__item">Головоломки</a>
                                <a href="catalog.html?genre=party" class="catalog-categories__item">Для вечеринок</a>
                                <a href="catalog.html" class="catalog-categories__item">Другие</a>
                            </div>
                        </div>
                    </li>
                    <li class="nav__item"><a href="delivery.html" class="nav__link">Доставка и оплата</a></li>
                    <li class="nav__item"><a href="about.html" class="nav__link">О нас</a></li>
                    <li class="nav__item"><a href="profile.html" class="nav__link">Профиль</a></li>
                </ul>
            </nav>
            <div class="actions">
                <div class="search">
                    <form class="search__form" id="search-form">
                        <input type="text" class="search__input" id="search-input" placeholder="Поиск игр...">
                        <button type="submit" class="search__submit" aria-label="Найти">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </form>
                    <button type="button" class="icon-btn" id="search-toggle" aria-label="Поиск">
                        <svg class="icon-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
                <a href="favorites.html" class="icon-btn" aria-label="Избранное">
                    <svg class="icon-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </a>
                <button type="button" class="icon-btn" aria-label="Корзина">
                    <svg class="icon-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <h1 class="catalog-page__title">Избранное</h1>
            <p class="catalog-page__count" data-favorites-count>0 товаров</p>

            <div class="products-grid" data-favorites-grid style="margin-top: 24px;"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer__container">
            <div class="footer__contacts">
                <p class="footer__text">Телефон: <a href="tel:+79990000000" class="footer__link">8 8000 000-00-00</a></p>
                <p class="footer__text">Email: <a href="mailto:info@play.ru" class="footer__link">info@play.ru</a></p>
                <p class="footer__text">Адрес: г. Барнаул, ул. Ленина, 46</p>
            </div>
            <p class="footer__copyright">&copy; 2026 Play!. Все права защищены.</p>
        </div>
    </footer>

    <script src="../js/catalog.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/favorites.js"></script>
</body>
</html>
